name: PULSE validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m ruff check pulse app scripts tests
      - run: python -m ruff format --check pulse app scripts tests
      - run: python scripts/setup_demo.py --small
      - run: python -m pytest -q --junitxml=reports/test-results.xml
      - run: python scripts/check_docs.py
